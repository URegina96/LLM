# Инфраструктура приложения: база для журнала аудита и сам гейтвей
name: dorama-app

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dorama
      POSTGRES_USER: dorama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задай POSTGRES_PASSWORD в .env}
    ports:
      - "127.0.0.1:5433:5432"            # 5432 занят Postgres-ом Langfuse
    volumes:
      - postgres_data:/var/lib/postgresql/data   # данные переживают перезапуск контейнера
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dorama -d dorama"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  gateway:
    build: .                             # собрать образ из Dockerfile в этой папке
    ports:
      - "${GATEWAY_PORT:-8000}:8000"     # снаружи — 8000 (или GATEWAY_PORT), внутри — 8000
    env_file: .env                       # секреты: SECRET_KEY, ключи Langfuse, TMDB
    environment:
      # Адреса изнутри контейнера: «localhost» тут — сам контейнер, поэтому указываем явно
      DATABASE_URL: postgresql+asyncpg://dorama:${POSTGRES_PASSWORD}@postgres:5432/dorama
      REDIS_URL: redis://host.docker.internal:6379/0
      OLLAMA_BASE: http://host.docker.internal:11434
      LANGFUSE_BASE_URL: http://host.docker.internal:3001
    volumes:
      - ./data:/app/data:ro              # каталог дорам берём с диска (только чтение)
      - ./users.json:/app/users.json:ro  # пользователи и хеши паролей — не в образе, а с диска
    gpus: all                            # доступ к видеокарте: нужен nvidia-smi для метрик GPU
    depends_on:
      postgres:
        condition: service_healthy       # стартовать, когда база готова
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data: